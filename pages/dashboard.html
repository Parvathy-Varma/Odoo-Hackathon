<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GlobeTrotter | Dashboard</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
  <!-- Dark mode toggle -->
  <button id="themeToggle" class="theme-toggle">🌙</button>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>🌍 GlobeTrotter Dashboard</h1>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <!-- Top actions -->
    <div class="top-actions">
      <button class="new-trip-btn" onclick="goToCreateTrip()">➕ Plan New Trip</button>
    </div>

    <!-- Trip cards grid -->
    <div id="tripGrid" class="trip-grid"></div>

    <!-- Empty message -->
    <div id="emptyMsg" class="empty" style="display:none;">
      No trips yet. Start planning your first adventure!
    </div>
  </div>

  <!-- Scripts -->
  <script>
    const BASE_URL = "http://127.0.0.1:5000";
    const userId = localStorage.getItem("user_id");

    if (!userId) {
      window.location.href = "login.html";
    }

    function logout() {
      localStorage.clear();
      window.location.href = "login.html";
    }

    function goToCreateTrip() {
      window.location.href = "create-trip.html";
    }

    function loadTrips() {
      fetch(`${BASE_URL}/my-trips/${userId}`)
        .then(res => res.json())
        .then(data => {
          const grid = document.getElementById("tripGrid");
          const empty = document.getElementById("emptyMsg");
          grid.innerHTML = "";

          if (!data || data.length === 0) {
            empty.style.display = "block";
            return;
          }

          empty.style.display = "none";

          data.forEach(trip => {
            const card = document.createElement("div");
            card.className = "card trip-card";
            card.innerHTML = `
              <h3>${trip.trip_name}</h3>
              <div class="trip-dates">${trip.start_date} → ${trip.end_date}</div>
              <div class="trip-desc">${trip.description || "No description provided"}</div>
              <button class="view-btn" onclick="openTrip(${trip.id})">View Itinerary</button>
            `;
            grid.appendChild(card);
          });
        })
        .catch(() => {
          const empty = document.getElementById("emptyMsg");
          empty.innerText = "Unable to load trips. Please try again later.";
          empty.style.display = "block";
        });
    }

    function openTrip(tripId) {
      localStorage.setItem("trip_id", tripId);
      window.location.href = "itinerary.html";
    }

    // Load trips on page load
    loadTrips();
  </script>

  <!-- External JS -->
  <script src="../js/theme.js"></script>
</body>
</html>
