<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GlobeTrotter | Create Trip</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <!-- Dark mode toggle -->
  <button id="themeToggle" class="theme-toggle">🌙</button>

  <div class="box">
    <h2>Create New Trip</h2>
    <p class="subtitle">Plan your next adventure</p>

    <label for="tripName">Trip Name</label>
    <input type="text" id="tripName" placeholder="e.g. Europe Vacation">

    <label for="startDate">Start Date</label>
    <input type="date" id="startDate">

    <label for="endDate">End Date</label>
    <input type="date" id="endDate">

    <label for="description">Description</label>
    <textarea id="description" placeholder="Short trip description"></textarea>

    <div class="btn-group">
      <button class="cancel-btn" onclick="goBack()">Cancel</button>
      <button class="save-btn" onclick="createTrip()">Save Trip</button>
    </div>

    <p id="msg"></p>
  </div>

  <script>
    const BASE_URL = "http://127.0.0.1:5000";
    const userId = localStorage.getItem("user_id");

    if (!userId) {
      window.location.href = "login.html";
    }

    function goBack() {
      window.location.href = "dashboard.html";
    }

    function createTrip() {
      const tripName = document.getElementById("tripName").value.trim();
      const startDate = document.getElementById("startDate").value;
      const endDate = document.getElementById("endDate").value;
      const description = document.getElementById("description").value.trim();
      const msg = document.getElementById("msg");

      msg.className = "";
      msg.innerText = "";

      if (!tripName || !startDate || !endDate) {
        msg.innerText = "Please fill all required fields";
        return;
      }

      fetch(`${BASE_URL}/create-trip`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user_id: userId,
          trip_name: tripName,
          start_date: startDate,
          end_date: endDate,
          description: description
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          msg.className = "success";
          msg.innerText = "Trip created successfully!";
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1200);
        } else {
          msg.innerText = data.message || "Failed to create trip";
        }
      })
      .catch(() => {
        msg.innerText = "Server error. Please try again.";
      });
    }
  </script>

  <!-- External theme script for dark mode -->
  <script src="../js/theme.js"></script>
</body>
</html>
