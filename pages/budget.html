<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GlobeTrotter | Trip Budget</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <!-- Dark mode toggle -->
  <button id="themeToggle" class="theme-toggle">🌙</button>

  <div class="box container">
    <h2>💰 Trip Budget Overview</h2>

    <div class="total-card" id="totalCost">
      Total Cost: ₹0
    </div>

    <h3>Cost Breakdown</h3>

    <table>
      <thead>
        <tr>
          <th>City</th>
          <th>Activity</th>
          <th>Cost (₹)</th>
        </tr>
      </thead>
      <tbody id="budgetTable">
        <!-- Rows added dynamically -->
      </tbody>
    </table>

    <div class="back-btn">
      <button onclick="goBack()">⬅ Back to Dashboard</button>
    </div>
  </div>

  <script>
    const BASE_URL = "http://127.0.0.1:5000";
    const tripId = localStorage.getItem("trip_id");

    if (!tripId) {
      window.location.href = "dashboard.html";
    }

    function loadBudget() {
      fetch(`${BASE_URL}/api/budget/${tripId}`)
        .then(res => res.json())
        .then(data => {
          document.getElementById("totalCost").innerText =
            "Total Cost: ₹" + data.totalCost;

          const table = document.getElementById("budgetTable");
          table.innerHTML = "";

          data.breakdown.forEach(item => {
            const row = document.createElement("tr");
            row.innerHTML = `
              <td>${item.city}</td>
              <td>${item.activity}</td>
              <td>₹${item.cost}</td>
            `;
            table.appendChild(row);
          });
        })
        .catch(err => {
          const table = document.getElementById("budgetTable");
          table.innerHTML = `<tr><td colspan="3">Failed to load budget</td></tr>`;
        });
    }

    function goBack() {
      window.location.href = "dashboard.html";
    }

    loadBudget();
  </script>

  <script src="../js/theme.js"></script>
</body>
</html>
